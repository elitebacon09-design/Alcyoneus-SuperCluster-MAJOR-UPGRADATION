<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alcyoneus SuperCluster — Sidebar & Birthday Book</title>
  <style>
    :root {
      --bg-void: #05070e;
      --bg-card: #0b1021;
      --bg-elevated: #111830;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff2a85;
      --neon-gold: #ffd166;
      --text-main: #f3f6ff;
      --text-muted: #9aa7c7;
      --border-glow: rgba(0, 240, 255, 0.35);
      --danger: #ff4d6d;
      --success: #2ce69b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #101938 0%, var(--bg-void) 70%);
      color: var(--text-main);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .sidebar-shell {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: linear-gradient(160deg, rgba(17, 24, 48, 0.95), rgba(8, 12, 26, 0.98));
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .panel:hover {
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.22);
    }

    /* Welcome Card */
    .welcome-card {
      text-align: center;
    }

    .club-badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .welcome-image-wrap {
      width: 100%;
      height: 148px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0, 240, 255, 0.45);
      background: #070b17;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .welcome-caption {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--neon-cyan);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.45);
    }

    /* Birthday Book */
    .bday-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .bday-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bday-count-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--neon-gold);
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.4);
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .actor-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-elevated);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .actor-label {
      color: var(--text-muted);
    }

    .actor-handle {
      color: var(--neon-cyan);
      font-weight: 700;
    }

    .btn-mini {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-mini:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .bday-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .field-group input {
      width: 100%;
      background: var(--bg-void);
      border: 1px solid rgba(0, 240, 255, 0.28);
      border-radius: 10px;
      padding: 9px 11px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .field-group input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .btn-save {
      width: 100%;
      background: linear-gradient(90deg, #00c6ff, #00f0ff);
      color: #041018;
      font-weight: 800;
      font-size: 13px;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .btn-save:hover {
      opacity: 0.94;
      transform: translateY(-1px);
    }

    .btn-save:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg {
      min-height: 18px;
      font-size: 12px;
      margin-bottom: 10px;
      line-height: 1.35;
    }

    .status-msg.error {
      color: var(--danger);
    }

    .status-msg.success {
      color: var(--success);
    }

    .status-msg.info {
      color: var(--neon-cyan);
    }

    .bday-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 340px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 18px 10px;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      border-radius: 12px;
    }

    .bday-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-elevated);
      border: 1px solid rgba(0, 240, 255, 0.22);
      border-radius: 12px;
      padding: 10px;
    }

    .bday-user-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .bday-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--neon-cyan);
      background: #060913;
      flex-shrink: 0;
    }

    .bday-meta {
      min-width: 0;
    }

    .bday-username {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bday-date-text {
      font-size: 11px;
      color: var(--text-muted);
    }

    .bday-owner-tag {
      display: inline-block;
      margin-top: 3px;
      font-size: 10px;
      color: var(--neon-gold);
    }

    .bday-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .bday-countdown {
      font-size: 11px;
      font-weight: 700;
      color: var(--neon-cyan);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .btn-delete {
      background: rgba(255, 77, 109, 0.14);
      color: var(--danger);
      border: 1px solid rgba(255, 77, 109, 0.45);
      border-radius: 7px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: rgba(255, 77, 109, 0.25);
    }
  </style>
</head>
<body>
  <aside class="sidebar-shell" aria-label="Alcyoneus SuperCluster Sidebar">
    <!-- Welcome Card -->
    <section class="panel welcome-card">
      <div class="club-badge">Alcyoneus SuperCluster</div>
      <div class="welcome-image-wrap">
        <img
          src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=800&q=80"
          alt="Deep space cosmic nebula representing Alcyoneus SuperCluster"
        />
      </div>
      <p class="welcome-caption">Welcome on board</p>
    </section>

    <!-- Birthday Book Widget -->
    <section class="panel" id="birthdayBookWidget">
      <div class="bday-header">
        <h2 class="bday-title">Birthday Book</h2>
        <span class="bday-count-pill" id="bdayCount">0 Saved</span>
      </div>

      <div class="actor-bar">
        <div>
          <span class="actor-label">Posting as:</span>
          <span class="actor-handle" id="currentActorDisplay">guest_user</span>
        </div>
        <button type="button" class="btn-mini" id="switchActorBtn">Switch User</button>
      </div>

      <form class="bday-form" id="birthdayForm">
        <div class="field-group">
          <label for="chessUsernameInput">Chess.com Username</label>
          <input
            type="text"
            id="chessUsernameInput"
            placeholder="e.g. hikaru or magnus"
            autocomplete="off"
            required
          />
        </div>

        <div class="field-group">
          <label for="birthdayDateInput">Birthday Date</label>
          <input type="date" id="birthdayDateInput" required />
        </div>

        <button type="submit" class="btn-save" id="saveBirthdayBtn">Save Birthday</button>
      </form>

      <div class="status-msg info" id="bdayStatus"></div>

      <div class="bday-list" id="birthdayList"></div>
    </section>
  </aside>

  <script>
    const STORAGE_KEY = "alcyoneus_public_birthdays_v1";
    const ACTOR_KEY = "alcyoneus_active_actor_v1";
    const CHANNEL_NAME = "alcyoneus_birthday_book_sync";
    const FALLBACK_AVATAR =
      "https://www.chess.com/bundles/web/images/user-image.svg";

    // Optional: set a shared cloud JSON/Firebase Realtime Database URL if syncing across separate devices/networks.
    const PUBLIC_SYNC_ENDPOINT = "";

    const channel =
      typeof BroadcastChannel !== "undefined"
        ? new BroadcastChannel(CHANNEL_NAME)
        : null;

    let birthdays = [];
    let removedByMe = new Set();
    let activeActor = loadActiveActor();

    const chessUsernameInput = document.getElementById("chessUsernameInput");
    const birthdayDateInput = document.getElementById("birthdayDateInput");
    const saveBirthdayBtn = document.getElementById("saveBirthdayBtn");
    const bdayStatus = document.getElementById("bdayStatus");
    const bdayCount = document.getElementById("bdayCount");
    const birthdayList = document.getElementById("birthdayList");
    const currentActorDisplay = document.getElementById("currentActorDisplay");
    const switchActorBtn = document.getElementById("switchActorBtn");
    const birthdayForm = document.getElementById("birthdayForm");

    function normalizeHandle(name) {
      return String(name || "").trim().toLowerCase();
    }

    function loadActiveActor() {
      const saved = normalizeHandle(localStorage.getItem(ACTOR_KEY));
      if (saved) return saved;
      const generated = "member_" + Math.random().toString(36).slice(2, 7);
      localStorage.setItem(ACTOR_KEY, generated);
      return generated;
    }

    function setActiveActor(newHandle) {
      const clean = normalizeHandle(newHandle);
      if (!clean) return;
      activeActor = clean;
      localStorage.setItem(ACTOR_KEY, activeActor);
      currentActorDisplay.textContent = activeActor;
      renderBirthdays();
    }

    function setStatus(msg, type = "info") {
      bdayStatus.textContent = msg;
      bdayStatus.className = `status-msg ${type}`;
    }

    function readLocalBirthdays() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function writeLocalBirthdays(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      if (channel) {
        channel.postMessage({ type: "SYNC_BIRTHDAYS", items: list });
      }
    }

    async function fetchRemoteBirthdays() {
      if (!PUBLIC_SYNC_ENDPOINT) return null;
      try {
        const res = await fetch(PUBLIC_SYNC_ENDPOINT, { cache: "no-store" });
        if (!res.ok) return null;
        const data = await res.json();
        if (Array.isArray(data)) return data;
        if (data && typeof data === "object") {
          return Object.values(data).filter(
            (item) => item && item.username && item.birthday
          );
        }
        return [];
      } catch {
        return null;
      }
    }

    async function pushRemoteBirthdays(list) {
      if (!PUBLIC_SYNC_ENDPOINT) return;
      try {
        await fetch(PUBLIC_SYNC_ENDPOINT, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(list),
        });
      } catch {
        // Keep local & broadcast sync working even if remote endpoint is unreachable
      }
    }

    function sanitizeList(rawList) {
      const seen = new Set();
      const cleaned = [];
      for (const entry of rawList) {
        if (!entry || !entry.username || !entry.birthday) continue;
        const handle = normalizeHandle(entry.username);
        if (!handle || seen.has(handle)) continue;
        if (removedByMe.has(handle)) continue;
        seen.add(handle);
        cleaned.push({
          username: handle,
          displayName: entry.displayName || entry.username,
          avatar: entry.avatar || FALLBACK_AVATAR,
          birthday: entry.birthday, // YYYY-MM-DD
          savedBy: normalizeHandle(entry.savedBy || handle),
          savedAt: entry.savedAt || Date.now(),
        });
      }
      return cleaned;
    }

    async function syncFromPublicSource() {
      const localItems = readLocalBirthdays();
      const remoteItems = await fetchRemoteBirthdays();
      const merged = remoteItems !== null ? remoteItems : localItems;
      birthdays = sanitizeList(merged);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(birthdays));
      renderBirthdays();
    }

    async function fetchChessComProfile(username) {
      const handle = normalizeHandle(username);
      const url = `https://api.chess.com/pub/player/${encodeURIComponent(handle)}`;
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`Chess.com user "${handle}" was not found.`);
      }
      const data = await res.json();
      return {
        username: normalizeHandle(data.username || handle),
        displayName: data.name ? `${data.username} (${data.name})` : data.username || handle,
        avatar: data.avatar || FALLBACK_AVATAR,
      };
    }

    function getNextBirthdayCountdown(isoDateStr) {
      const parts = String(isoDateStr).split("-");
      if (parts.length !== 3) {
        return { label: "Invalid date", days: Number.POSITIVE_INFINITY };
      }

      const month = Number(parts[1]) - 1;
      const day = Number(parts[2]);
      const now = new Date();
      let target = new Date(now.getFullYear(), month, day, 0, 0, 0, 0);

      if (target.getTime() < now.getTime()) {
        target = new Date(now.getFullYear() + 1, month, day, 0, 0, 0, 0);
      }

      const diffMs = Math.max(0, target.getTime() - now.getTime());
      const totalSeconds = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      if (days === 0 && hours < 24 && target.getDate() === now.getDate() && target.getMonth() === now.getMonth()) {
        return { label: "Birthday Today!", days: 0 };
      }

      return {
        label: `${days}d ${hours}h ${minutes}m ${seconds}s`,
        days,
      };
    }

    function formatMonthDay(isoDateStr) {
      const parts = String(isoDateStr).split("-");
      if (parts.length !== 3) return isoDateStr;
      const temp = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return temp.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function renderBirthdays() {
      const visible = sanitizeList(birthdays);
      birthdays = visible;
      bdayCount.textContent = `${visible.length} Saved`;

      if (visible.length === 0) {
        birthdayList.innerHTML = `<div class="empty-state">No birthdays saved yet. Add a Chess.com username and date above.</div>`;
        return;
      }

      const sorted = [...visible].sort((a, b) => {
        return (
          getNextBirthdayCountdown(a.birthday).days -
          getNextBirthdayCountdown(b.birthday).days
        );
      });

      birthdayList.innerHTML = sorted
        .map((entry) => {
          const countdown = getNextBirthdayCountdown(entry.birthday);
          const isOwner = normalizeHandle(entry.savedBy) === activeActor;

          return `
            <div class="bday-item" data-user="${entry.username}">
              <div class="bday-user-left">
                <img
                  class="bday-avatar"
                  src="${entry.avatar}"
                  alt="${entry.username} Chess.com avatar"
                  onerror="this.onerror=null;this.src='${FALLBACK_AVATAR}';"
                />
                <div class="bday-meta">
                  <div class="bday-username">${entry.displayName}</div>
                  <div class="bday-date-text">Birthday: ${formatMonthDay(entry.birthday)}</div>
                  <div class="bday-owner-tag">${isOwner ? "Saved by you" : `Saved by ${entry.savedBy}`}</div>
                </div>
              </div>
              <div class="bday-right">
                <div class="bday-countdown">${countdown.label}</div>
                ${
                  isOwner
                    ? `<button type="button" class="btn-delete" data-delete-user="${entry.username}">Remove</button>`
                    : ""
                }
              </div>
            </div>
          `;
        })
        .join("");
    }

    birthdayForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const rawHandle = normalizeHandle(chessUsernameInput.value);
      const bdayValue = birthdayDateInput.value;

      if (!rawHandle || !bdayValue) {
        setStatus("Please enter both a Chess.com username and a birthday date.", "error");
        return;
      }

      const duplicate = birthdays.some(
        (item) => normalizeHandle(item.username) === rawHandle
      );
      if (duplicate) {
        setStatus(`"${rawHandle}" already has a birthday in the book. Duplicates are blocked.`, "error");
        return;
      }

      saveBirthdayBtn.disabled = true;
      setStatus(`Fetching @${rawHandle} from Chess.com...`, "info");

      try {
        const profile = await fetchChessComProfile(rawHandle);
        removedByMe.delete(profile.username);

        const newEntry = {
          username: profile.username,
          displayName: profile.displayName,
          avatar: profile.avatar,
          birthday: bdayValue,
          savedBy: activeActor,
          savedAt: Date.now(),
        };

        birthdays = sanitizeList([...birthdays, newEntry]);
        writeLocalBirthdays(birthdays);
        await pushRemoteBirthdays(birthdays);
        renderBirthdays();

        chessUsernameInput.value = "";
        birthdayDateInput.value = "";
        setStatus(`Saved ${profile.username}'s birthday to the public Birthday Book.`, "success");
      } catch (err) {
        setStatus(err.message || "Could not verify Chess.com profile.", "error");
      } finally {
        saveBirthdayBtn.disabled = false;
      }
    });

    birthdayList.addEventListener("click", async (event) => {
      const btn = event.target.closest("[data-delete-user]");
      if (!btn) return;

      const targetHandle = normalizeHandle(btn.getAttribute("data-delete-user"));
      const entry = birthdays.find(
        (item) => normalizeHandle(item.username) === targetHandle
      );

      if (!entry) return;

      if (normalizeHandle(entry.savedBy) !== activeActor) {
        setStatus("You can only remove birthdays that you saved yourself.", "error");
        return;
      }

      removedByMe.add(targetHandle);
      birthdays = birthdays.filter(
        (item) => normalizeHandle(item.username) !== targetHandle
      );
      writeLocalBirthdays(birthdays);
      await pushRemoteBirthdays(birthdays);
      renderBirthdays();
      setStatus(`Removed ${targetHandle}'s entry from the list.`, "success");
    });

    switchActorBtn.addEventListener("click", () => {
      const nextName = window.prompt(
        "Enter your user handle for ownership & testing:",
        activeActor
      );
      if (nextName && normalizeHandle(nextName)) {
        setActiveActor(nextName);
        setStatus(`Switched active user to "${activeActor}".`, "info");
      }
    });

    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_KEY) {
        birthdays = sanitizeList(readLocalBirthdays());
        renderBirthdays();
      }
    });

    if (channel) {
      channel.addEventListener("message", (event) => {
        if (event.data && event.data.type === "SYNC_BIRTHDAYS" && Array.isArray(event.data.items)) {
          birthdays = sanitizeList(event.data.items);
          renderBirthdays();
        }
      });
    }

    currentActorDisplay.textContent = activeActor;
    syncFromPublicSource();
    setInterval(renderBirthdays, 1000);
    if (PUBLIC_SYNC_ENDPOINT) {
      setInterval(syncFromPublicSource, 5000);
    }
  </script>
</body>
</html>
